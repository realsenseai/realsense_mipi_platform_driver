name: Teams CI status

# Refresh the PR's Teams card on the D4xx Jenkins status, JetPack builds and Aikido results;
# a red result also posts a reply so people get pinged.
on:
  status:
  check_run:
    types: [completed]
  workflow_run:
    workflows: [Build JP 5.0.2, Build JP 5.1.2, Build JP 5.1.6, Build JP 6.0, Build JP 6.1,
                Build JP 6.2, Build JP 6.2.2, Build JP 7.0, Build JP 7.1, Build JP 7.2]
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: read
  checks: read
  actions: read

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' && startsWith(github.event.context, 'D4xx_Kernel_Module')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_run' && startsWith(github.event.check_run.name, 'Aikido'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 #v3
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Update the PR's Teams card
        continue-on-error: true
        env:
          HOOK: ${{ secrets.TEAMS_CI_FLOW_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JENKINS_RE: ^D4xx_Kernel_Module
          JENKINS_JOB: D4xx_Kernel_Module_Jetson_JP6
          SETTLE: 30
          BUILDS: Build JP 5.0.2,Build JP 5.1.2,Build JP 5.1.6,Build JP 6.0,Build JP 6.1,Build JP 6.2,Build JP 6.2.2,Build JP 7.0,Build JP 7.1,Build JP 7.2
          EVENT: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          SHA: ${{ github.event.sha }}
          STATE: ${{ github.event.state }}
          URL: ${{ github.event.target_url }}
          CONTEXT: ${{ github.event.context }}
          BRANCHES_JSON: ${{ toJSON(github.event.branches) }}
          CR_SHA: ${{ github.event.check_run.head_sha }}
          CR_CONCLUSION: ${{ github.event.check_run.conclusion }}
          CR_URL: ${{ github.event.check_run.details_url }}
          CR_PRS: ${{ toJSON(github.event.check_run.pull_requests) }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          WR_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          [ -n "$HOOK" ] || { echo "TEAMS_CI_FLOW_URL not set"; exit 0; }
          PR="$INPUT_PR"
          case "$EVENT" in
            check_run)    SHA="$CR_SHA"; PR=$(echo "$CR_PRS" | jq -r '.[0].number // empty' 2>/dev/null || true) ;;
            workflow_run) SHA="$WR_SHA"; PR=$(echo "$WR_PRS" | jq -r '.[0].number // empty' 2>/dev/null || true) ;;
          esac
          if [ -z "$PR" ] && [ -n "$SHA" ]; then
            PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          # Merge-queue commits belong to no PR; take it from the queue branch whose head (per the
          # event payload, as a failed entry's branch is deleted at once) is this SHA.
          if [ -z "$PR" ] && [ "$EVENT" = status ]; then
            b=$(echo "$BRANCHES_JSON" | jq -r --arg s "$SHA" '.[]? | select(.commit.sha == $s) | .name' \
                | grep -E '^gh-readonly-queue/.*/pr-[0-9]+-' | head -1 || true)
            PR=$(echo "$b" | sed -nE 's#.*/pr-([0-9]+)-.*#\1#p')
            [ -n "$PR" ] && export QUEUE_SHA="$SHA"
          fi
          [ -n "$PR" ] || { echo "No PR for $SHA"; exit 0; }
          # Jenkins sets pending twice; the first ("Triggered", queued) has no build link yet.
          [ "$EVENT" = status ] && [ "$STATE" = pending ] && [ -z "$URL" ] && { echo "Queued"; exit 0; }
          WHERE="${QUEUE_SHA:+ in the merge queue}"
          case "$EVENT:$STATE$CR_CONCLUSION$WR_CONCLUSION" in
            status:failure|status:error)
              export NOTIFY_TEXT="<b>$CONTEXT $STATE$WHERE ❌</b> · <a href=\"$URL\">Open build</a>" ;;
            check_run:failure|check_run:action_required)
              export NOTIFY_TEXT="<b>Aikido $CR_CONCLUSION ❌</b> · <a href=\"$CR_URL\">Open scan</a>" ;;
            workflow_run:failure)
              export NOTIFY_TEXT="<b>$WR_NAME failed ❌</b> · <a href=\"$WR_URL\">Open run</a>" ;;
          esac
          export PR
          bash .github/scripts/teams-card.sh
